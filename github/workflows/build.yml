name: Compilar APK con Buildozer

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev ncurses-dev libreadline-dev libsqlite3-dev \
            libssl-dev lzma lzma-dev libffi-dev zlib1g-dev openjdk-17-jdk

    - name: Instalar Buildozer y Cython
      run: |
        pip install --upgrade pip
        pip install cython==0.29.36 buildozer

    - name: Inicializar Buildozer
      run: |
        buildozer init
        sed -i 's/# title = My Application/title = Futve Carrera/' buildozer.spec
        sed -i 's/# package.name = myapp/package.name = futvecarrera/' buildozer.spec
        sed -i 's/# package.domain = org.test/package.domain = org.futve/' buildozer.spec
        sed -i 's/# requirements = python3,kivy/requirements = python3/' buildozer.spec

    - name: Ejecutar Buildozer para compilar APK
      run: |
        buildozer -v android debug

    - name: Subir APK generado
      uses: actions/upload-artifact@v3
      with:
        name: paquete-apk
        path: bin/*.apk
        
